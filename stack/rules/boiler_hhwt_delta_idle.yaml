# Boiler is running but not actively heating, yet HHW supply/return delta is unexpectedly large or negative.
# Catches stuck-open bypass valve, sensor reversal (negative delta), fouled heat exchanger, or mis-wired sensors.
# A 1-hour rolling window avoids nuisance trips during transient state changes; 5-min data assumed (12 samples/h).
name: boiler_hhwt_delta_idle
description: HHW supply/return delta abnormal while boiler running but not heating
type: expression
flag: boiler_hhwt_delta_idle_flag
category: general
severity: warning
equipment_type:
  - Boiler

inputs:
  Hot_Water_Supply_Temperature_Sensor:
    brick: Hot_Water_Supply_Temperature_Sensor
  Hot_Water_Return_Temperature_Sensor:
    brick: Hot_Water_Return_Temperature_Sensor
  Boiler_Status:
    brick: Boiler_Status

params:
  delta_high: 2.0       # °C — upper bound for ΔT when boiler is idle/not heating
  delta_low: -0.2       # °C — negative threshold flags likely sensor reversal
  rolling_window: 12    # 12 consecutive 5-min samples = 1 h (matches trigger period)

expression: |
  (
    (normalize_cmd(Boiler_Status) > 0) &
    (
      (np.abs(Hot_Water_Supply_Temperature_Sensor - Hot_Water_Return_Temperature_Sensor) > delta_high) |
      ((Hot_Water_Supply_Temperature_Sensor - Hot_Water_Return_Temperature_Sensor) < delta_low)
    )
  )
