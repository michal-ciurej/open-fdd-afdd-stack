# AHU discharge (supply air) static pressure sensor reads outside absolute limits or
# deviates more than 25% from setpoint, indicating a faulty/stuck sensor or control fault.
# Catches failed pressure transducers, blocked sensing tubes, incorrect SP, or duct leakage.
# Trigger period is 2 h → rolling_window of 24 samples at 5-min data.
name: ahu_discharge_pressure_unexpected_value
description: Supply air static pressure sensor out of bounds or >25% from setpoint
type: expression
flag: ahu_discharge_pressure_unexpected_value_flag
category: general
severity: warning
equipment_type:
  - Air_Handling_Unit

inputs:
  Supply_Air_Static_Pressure_Sensor:
    brick: Supply_Air_Static_Pressure_Sensor
  Supply_Air_Static_Pressure_Setpoint:
    brick: Supply_Air_Static_Pressure_Setpoint

params:
  abs_low:  -25.0       # Pa — absolute lower bound; readings below this are always invalid
  abs_high: 700.0       # Pa — absolute upper bound; readings above this are always invalid
  sp_dev_frac: 0.25     # fraction — flag when sensor deviates >25% from setpoint
  rolling_window: 24    # 24 consecutive samples = ~2 h at 5-min data (matches trigger period)

expression: |
  (
    (Supply_Air_Static_Pressure_Sensor < abs_low) |
    (Supply_Air_Static_Pressure_Sensor > abs_high) |
    (
      np.abs(Supply_Air_Static_Pressure_Sensor - Supply_Air_Static_Pressure_Setpoint) >
      (sp_dev_frac * np.abs(Supply_Air_Static_Pressure_Setpoint))
    )
  )
