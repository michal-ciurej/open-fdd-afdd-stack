# Chiller entering condenser water temperature (CDWT) persistently above threshold while chiller is running.
# Catches cooling tower under-performance, condenser water pump issues, tower bypass valve fault, or high ambient wet-bulb.
# Trigger period is 30 min → rolling_window of 6 samples at 5-min data.
name: chiller_entering_cdwt_too_high
description: Entering condenser water temp too high while chiller is running
type: expression
flag: chiller_entering_cdwt_too_high_flag
category: general
severity: warning
equipment_type:
  - Chiller

inputs:
  Condenser_Water_Leaving_Temperature_Sensor:
    brick: Condenser_Water_Leaving_Temperature_Sensor
  Chiller_Run_Status:
    brick: Chiller_Run_Status

params:
  cdwt_high_limit: 30.0   # °C - entering CDWT above this indicates condenser water system issue
  rolling_window: 6        # 30 min at 5-min sampling (debounce)

expression: |
  (
    (Condenser_Water_Leaving_Temperature_Sensor.rolling(window=rolling_window).mean() > cdwt_high_limit)
    & (normalize_cmd(Chiller_Run_Status) > 0)
  )
