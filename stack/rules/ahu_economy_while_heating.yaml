# AHU economy damper is open (economy cycle active) while the heating valve is also open.
# Catches simultaneous heating and free-cooling, wasting energy by working against itself.
# CO2 condition from legacy rule is optional; core fault is economy+heating overlap.
# Trigger period 30 min → rolling_window: 6 at 5-min sampling.
name: ahu_economy_while_heating
description: Economy damper open while heating valve is active - simultaneous heating and cooling
type: expression
flag: ahu_economy_while_heating_flag
category: general
severity: warning
equipment_type:
  - Air_Handling_Unit

inputs:
  Heating_Valve_Command:
    brick: Heating_Valve_Command
  Outside_Air_Damper_Command:
    brick: Outside_Air_Damper_Command
  Supply_Air_Temperature_Sensor:
    brick: Supply_Air_Temperature_Sensor

params:
  econ_damper_open_threshold: 0.5   # fraction - damper above 50% indicates economy cycle active
  heat_valve_open_threshold: 0.1    # fraction - heating valve above 10% indicates heating active
  rolling_window: 6                 # ~30 min at 5-min sampling (matches legacy trigger period)

expression: |
  (
    (normalize_cmd(Outside_Air_Damper_Command) > econ_damper_open_threshold)
    & (normalize_cmd(Heating_Valve_Command) > heat_valve_open_threshold)
  )
