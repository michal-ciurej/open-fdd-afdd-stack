# Condensing boiler entering hot water temperature exceeds condensing threshold while boiler is running.
# High return/entering water temperature prevents condensing operation, reducing efficiency and risking equipment damage.
# Catches oversized boiler, poor system design, missing low-loss header, or incorrect setpoint scheduling.
# Trigger period: 2 hours → 24 samples at 5-min data.
name: boiler_condensing_entering_hwt_too_high
description: Condensing boiler entering HW temp above condensing threshold while running
type: expression
flag: boiler_condensing_entering_hwt_too_high_flag
category: general
severity: warning
equipment_type:
  - Boiler

inputs:
  Hot_Water_Return_Temperature_Sensor:
    brick: Hot_Water_Return_Temperature_Sensor
  Boiler_Status:
    brick: Boiler_Status

params:
  entering_hwt_max: 53.0   # °C — above this, condensing boilers cannot condense flue gases
  rolling_window: 24        # 24 consecutive 5-min samples = 2 h (matches trigger period)

expression: |
  (Hot_Water_Return_Temperature_Sensor > entering_hwt_max) & (normalize_cmd(Boiler_Status) > 0)
