# Pump commanded on by BMS but status feedback (current switch / VFD run) reports off.
# Catches tripped motor, open breaker, failed VFD, broken CS, bad DI wiring.
name: pump_cmd_no_status
description: Pump commanded on but status feedback reports off
type: expression
flag: pump_cmd_no_status_flag
equipment_type: [Pump]

inputs:
  Pump_Command:
    brick: Pump_Command
  Pump_Status:
    brick: Pump_Status

params:
  cmd_on_threshold: 0.5       # fraction - command above 50% treated as "on"
  status_off_threshold: 0.5   # fraction - status below 50% treated as "off"
  rolling_window: 3           # 3 consecutive samples (~15 min at 5-min data) debounce - ignore start/stop transients

expression: |
  (normalize_cmd(Pump_Command) > cmd_on_threshold) & (normalize_cmd(Pump_Status) < status_off_threshold)
