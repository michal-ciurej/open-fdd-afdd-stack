# AHU frost/preheat coil commanded open while outside air temperature is above the frost-risk threshold.
# Indicates unnecessary heating energy use; likely causes: stuck valve, incorrect control logic,
# faulty OAT sensor, or setpoint misconfiguration.
# Tuning note: OAT threshold of 5°C is the legacy trigger; rolling_window = 12 samples (~1 h at 5-min).
name: ahu_frost_coil_running_excessively
description: Frost coil commanded open while OAT is above frost-risk threshold
type: expression
flag: ahu_frost_coil_running_excessively_flag
category: general
severity: warning
equipment_type:
  - Air_Handling_Unit

inputs:
  Supply_Fan_Status:
    brick: Supply_Fan_Status
  Heating_Valve_Command:
    brick: Heating_Valve_Command
  Outside_Air_Temperature_Sensor:
    brick: Outside_Air_Temperature_Sensor

params:
  oat_frost_threshold: 5.0   # °C - above this OAT, frost coil should not be needed
  vlv_open: 0.05             # fraction - treat anything above 5% as "open"
  fan_on_threshold: 0.5      # fraction - normalized fan status above 50% treated as "running"
  rolling_window: 12         # 12 samples = ~1 h at 5-min data (matches 1-hour trigger period)

expression: |
  (
    (normalize_cmd(Supply_Fan_Status) > fan_on_threshold)
    & (normalize_cmd(Heating_Valve_Command) > vlv_open)
    & (Outside_Air_Temperature_Sensor > oat_frost_threshold)
  )
