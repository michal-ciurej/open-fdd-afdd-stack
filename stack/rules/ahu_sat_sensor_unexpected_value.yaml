# SAT sensor reads an implausible value (too hot or too cold) while the AHU is running.
# Catches failed/miscalibrated supply-air temperature sensors, sensor wiring faults,
# or sensor placed in wrong location. A 2-hour persistence check avoids transient trips.
# Tuning: lower bound uses 7°C (standard); reduce to 5°C for tempering units.
name: ahu_sat_sensor_unexpected_value
description: SAT sensor out of plausible range while AHU is running
type: expression
flag: ahu_sat_sensor_unexpected_value_flag
category: general
severity: warning
equipment_type:
  - Air_Handling_Unit

inputs:
  Supply_Air_Temperature_Sensor:
    brick: Supply_Air_Temperature_Sensor
  Supply_Fan_Status:
    brick: Supply_Fan_Status

params:
  sat_max: 49.0         # °C — upper plausibility limit for supply air
  sat_min: 7.0          # °C — lower plausibility limit (standard; use 5°C for tempering units)
  rolling_window: 24    # 24 × 5-min samples = 2 h persistence check

expression: |
  (
    (Supply_Fan_Status > 0) &
    (
      (Supply_Air_Temperature_Sensor > sat_max) |
      (Supply_Air_Temperature_Sensor < sat_min)
    )
  )
