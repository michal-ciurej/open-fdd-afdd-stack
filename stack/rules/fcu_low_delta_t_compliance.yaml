# Compliance: Fan Coil Unit hydronic ΔT below target during cooling operation.
# A persistently low (return − supply) water-side ΔT signals overflow / bypass /
# valve-stuck-open — wastes pump energy and capacity. Flagged under the
# "compliance" category so it lights up the Compliance dashboard dial.
name: fcu_low_delta_t_compliance
description: FCU water-side ΔT below target while unit is in cooling
type: expression
flag: fcu_low_delta_t_compliance_flag
category: compliance
severity: warning
equipment_type: [Fan_Coil_Unit]

inputs:
  Supply_Water_Temperature_Sensor:
    brick: Supply_Water_Temperature_Sensor
  Return_Water_Temperature_Sensor:
    brick: Return_Water_Temperature_Sensor
  Cooling_Command:
    brick: Cooling_Command

params:
  min_delta_t_f: 8.0
  rolling_window: 12     # ~1 h at 5-min sampling

expression: |
  ((Return_Water_Temperature_Sensor - Supply_Water_Temperature_Sensor).rolling(window=rolling_window).mean() < min_delta_t_f) & (normalize_cmd(Cooling_Command) > 0)
